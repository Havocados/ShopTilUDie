<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- import bootstrap CSS and JS from the CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Document</title>
  </head>
  <body>
    <div class="input-group mb-3">
      <select class="custom-select" name="category" id="category-select">
        <option value="all">All</option>
        <option value="electronics">Electronics</option>
        <option value="jewelery">Jewelery</option>
        <option value="men's clothing">Men's Clothing</option>
        <option value="women's clothing">Women's Clothing</option>
      </select>
    </div>
    <button
      id="view-cart-button"
      class="btn btn-primary"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#offcanvasRightScroll"
      aria-controls="offcanvasRightScroll"
    >
      Toggle right offcanvas with scroll & backdrop
    </button>

    <div
      class="offcanvas offcanvas-end"
      data-bs-scroll="true"
      tabindex="-1"
      id="offcanvasRightScroll"
      aria-labelledby="offcanvasRightScrollLabel"
    >
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasRightScrollLabel">
          Offcanvas right
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        <h2>Cart</h2>
        <div id="cart-items-container">
            <div id="cart-items">
                <!-- Cart items will be injected here -->
            </div>
        </div>
        <button class="btn btn-primary">Go to Checkout</button>
        <button class="btn btn-danger">Delete All</button>
      </div>
    </div>
    <div class="album py-5 bg-body-tertiary">
      <div class="container">
        <div
          id="product-container"
          class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3"
        >
            <!-- Product cards will be injected here -->
        </div>

        <div class="pagination-container"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="../shoppingCart/shoppingCart.js"></script>
    <script type="module" src="../productCard/productCard.js"></script>

  </body>
</html>
